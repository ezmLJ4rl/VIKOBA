name: vikoba_app
description: Digital record-keeping and management system for Vikoba groups.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2          # state management
  intl: ^0.20.2             # date & currency formatting (TZS)
  fl_chart: ^0.68.0         # charts for reports/share-out
  http: ^1.2.1              # for Laravel API calls later
  shared_preferences: ^2.2.3 # simple local persistence (auth token etc.)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true            # flutter gen-l10n for en/sw locales
  fonts:
    - family: WorkSans      # body/UI — plain, high-legibility sans
      fonts:
        - asset: assets/fonts/WorkSans-Variable.ttf
    - family: Fraunces      # display — hero numbers & screen titles only
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
